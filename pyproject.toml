[project]
name = "prr"
version = "0.1.0"
description = "Interactive, Claude-guided GitHub PR review (backend for the /pr-review Claude Code skill)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
prr = "prr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prr"]

[tool.setuptools.package-data]
prr = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
