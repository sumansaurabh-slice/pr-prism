# Personal settings for prr / the /pr-prism skill. All keys are optional.

# Where fetched PRs, worktrees, analyses and review state live (outside your repos).
cache_dir = "~/.cache/pr-prism"

[models]
annotate = "sonnet"   # per-cluster file annotations (runs in parallel)
docs = "haiku"        # clusters that contain only docs
synthesize = "opus"   # one call: why/how, review path, flows, impact
chat = "opus"         # deep-dive chat in the web app
blockers = "sonnet"   # the blocker-rule pass (SQL/shell from request input, secrets, removed auth checks, destructive migrations)
judge = "haiku"       # the second look that scores every finding
ci = "sonnet"         # explaining CI failures, checking other review tools' comments, re-checking earlier findings

[analysis]
concurrency = 6            # parallel `claude -p` review calls
cluster_tokens = 12000     # max diff tokens per review call (small, so every file can be read in full)
cluster_max_files = 8
retries = 2
annotate_timeout_s = 900
synthesize_timeout_s = 1200

[chat]
can_post = true       # the chat may post comments (and comment-only reviews) to GitHub when you ask it to
can_approve = false   # set true to also let the chat approve or request changes
ask_before_actions = true   # the chat is full Claude Code; commands, edits and Jira/Slack actions ask you first

[budget]
warn_usd = 0   # a PR's total spend (analysis + chat + other checks) above this shows "over your $N limit" in the app; 0 = off. A warning only: nothing is stopped
