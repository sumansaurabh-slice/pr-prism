# Personal settings for prr / the /pr-prism skill. All keys are optional.

# Where fetched PRs, worktrees, analyses and review state live (outside your repos).
cache_dir = "~/.cache/pr-prism"

[models]
annotate = "sonnet"   # per-cluster file annotations (runs in parallel)
docs = "haiku"        # clusters that contain only docs
synthesize = "opus"   # one call: why/how, review path, flows, impact
chat = "opus"         # deep-dive chat in the web app
blockers = "sonnet"   # the blocker-rule pass (SQL/shell from request input, secrets, removed auth checks, destructive migrations)
judge = "haiku"       # the second look that scores every finding
ci = "sonnet"         # explaining CI failures, checking other review tools' comments, re-checking earlier findings
deepcheck = "opus"    # the deep check: asks "what could break?" in the riskiest areas, after the summary

[analysis]
concurrency = 6            # parallel `claude -p` review calls
cluster_tokens = 12000     # max diff tokens per review call (small, so every file can be read in full)
cluster_max_files = 8
retries = 2
annotate_timeout_s = 900
synthesize_timeout_s = 1200
deepcheck = true                 # run the deep check after the summary (adds a few minutes and roughly $1 per area, $2-6 per PR)
deepcheck_max_targets = 5        # areas checked per PR, riskiest first (3 run at a time, so 4 or 5 areas both take two rounds); skipped risky areas are listed as warnings
deepcheck_target_timeout_s = 600  # time limit for one area (a failed area retries once if the budget allows)
deepcheck_budget_s = 900         # no area starts after this many seconds; areas still running stop 60 s later
recheck_max = 20                 # after new commits: earlier problems and your comments Claude re-checks per run; the rest show "not checked"

[chat]
can_post = true       # the chat may post comments (and comment-only reviews) to GitHub when you ask it to
can_approve = false   # set true to also let the chat approve or request changes
ask_before_actions = true   # the chat is full Claude Code; commands, edits, reads outside the PR and Jira/Slack actions ask you first
# With false, nothing asks: reads outside the PR (~/.ssh, ~/.config/gh, …) and commands that print the environment
# are still blocked, but any program the chat runs can still read or send anything.

[budget]
warn_usd = 0   # a PR's total spend (analysis + chat + other checks) above this shows "over your $N limit" in the app; 0 = off. A warning only: nothing is stopped

[review]
max_stops = 12   # guided review lists at most this many places to check, riskiest first; answered ones always stay listed, and the rest show as "N more places"
